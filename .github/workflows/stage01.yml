name: Stage 01
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m uco_demo --object examples/vector_add.json --device examples/device_scalar.json --grant compute.vector.add.i32
      - run: python -m uco_demo --object examples/vector_add.json --device examples/device_chunked.json --grant compute.vector.add.i32
